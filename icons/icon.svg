<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="55%" stop-color="#0e1729"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="ball" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffd977"/>
      <stop offset="45%" stop-color="#f5c451"/>
      <stop offset="100%" stop-color="#e08a12"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6fd0"/>
      <stop offset="100%" stop-color="#26408c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#f5c451" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 后面两张倾斜的卡（营造"卡组"层次） -->
  <g opacity="0.42">
    <rect x="128" y="120" width="196" height="266" rx="22"
          transform="rotate(-15 226 253)" fill="#2b3f78" stroke="#5f7fd0" stroke-width="4"/>
    <rect x="188" y="116" width="196" height="266" rx="22"
          transform="rotate(15 286 249)" fill="#2b3f78" stroke="#5f7fd0" stroke-width="4"/>
  </g>

  <!-- 中间主卡 -->
  <g>
    <rect x="150" y="92" width="212" height="288" rx="24"
          fill="url(#cardface)" stroke="#9fc4ff" stroke-width="5"/>
    <!-- 卡面高光 -->
    <rect x="150" y="92" width="212" height="288" rx="24"
          fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
    <!-- 篮球 -->
    <g>
      <circle cx="256" cy="212" r="76" fill="url(#ball)"/>
      <g stroke="#5a3208" stroke-width="7" fill="none" stroke-linecap="round">
        <line x1="180" y1="212" x2="332" y2="212"/>
        <line x1="256" y1="136" x2="256" y2="288"/>
        <path d="M198 158 Q256 212 198 266"/>
        <path d="M314 158 Q256 212 314 266"/>
      </g>
      <!-- 球面高光 -->
      <ellipse cx="228" cy="182" rx="24" ry="17" fill="#fff8e6" opacity="0.5"
               transform="rotate(-28 228 182)"/>
    </g>
    <!-- 卡面底部数据条 -->
    <rect x="178" y="308" width="156" height="13" rx="6.5" fill="#ffffff" opacity="0.30"/>
    <rect x="178" y="332" width="104" height="11" rx="5.5" fill="#ffffff" opacity="0.20"/>
  </g>

  <!-- 顶部星光 -->
  <g fill="#ffe9a8">
    <path d="M394 88 l7 19 19 7 -19 7 -7 19 -7 -19 -19 -7 19 -7z" opacity="0.95"/>
    <path d="M118 372 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" opacity="0.75"/>
  </g>
</svg>
