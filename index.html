<!-- ============================================================
     锁横屏（像原生手游那样）
     ------------------------------------------------------------
     manifest 里声明 orientation:landscape + display:standalone，
     「添加到主屏幕」后从图标启动，iOS 会像原生游戏一样：
       · 一进去就是横屏
       · 系统「屏幕方向锁定」开着也不影响，画面不会转
     中文必须 URL 编码，否则 Safari 解析 manifest 会报错。
     ============================================================ -->
<link rel="manifest" href="manifest.webmanifest">
<title>巅峰球星卡 · 招募</title>
<link rel="stylesheet" href="pwa.css">
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="holo.css">
<link rel="stylesheet" href="battle.css">
<link rel="stylesheet" href="league.css">
<style>
:root{
  --bg0:#05070f; --bg1:#0b1120; --panel:rgba(255,255,255,.055); --line:rgba(255,255,255,.11);
  --ink:#e9eefc; --muted:#8593b5; --gold:#f5c451;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0}
html{overscroll-behavior:none}
button{touch-action:manipulation}   /* 关掉双击缩放，点按更跟手 */
input[type=checkbox]{touch-action:manipulation}
body{
  background:radial-gradient(900px 520px at 50% -6%,#1e2a4a 0%,transparent 62%),
    linear-gradient(180deg,var(--bg0),var(--bg1) 45%,var(--bg0));
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  display:flex;justify-content:center;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.hidden{display:none !important}
#app{width:100%;max-width:520px;min-height:100dvh;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 30%);
  box-shadow:0 0 90px rgba(0,0,0,.7)}

/* ---------- 顶栏 ---------- */
#topbar{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;
  padding:calc(10px + var(--safe-t)) 12px 10px;
  background:linear-gradient(180deg,rgba(5,7,15,.97),rgba(5,7,15,.75));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#topbar .logo{font-size:15px;font-weight:900;letter-spacing:.06em;margin-right:auto;white-space:nowrap;
  background:linear-gradient(180deg,#fff,#f5c451);-webkit-background-clip:text;background-clip:text;color:transparent}
.cur{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:800;white-space:nowrap}
.ic{width:15px;height:15px;border-radius:50%;flex:0 0 15px}
.ic-coin{background:radial-gradient(circle at 35% 30%,#ffe9a3,#f5c451 55%,#a97b12);
  box-shadow:0 0 8px rgba(245,196,81,.5)}
.ic-book{background:linear-gradient(140deg,#ffd9a0,#e8a33d);border-radius:3px}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 100px;-webkit-overflow-scrolling:touch}
.screen{display:none}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:12px}

/* ---------- 招募主视觉 ---------- */
.hero{position:relative;height:352px;overflow:hidden;margin-bottom:10px}
.hero.theme-blue{--h1:#1b3a7a;--h2:#0a1730;--acc:#3d8bfd;--acc2:#8fc0ff}
.hero.theme-gold{--h1:#6b4406;--h2:#1c1206;--acc:#f0a818;--acc2:#ffd977}
.hero.theme-purple{--h1:#4a1d7a;--h2:#160a2c;--acc:#a855f7;--acc2:#d9a8ff}
.hero-bg{position:absolute;inset:0;
  background:radial-gradient(120% 90% at 78% 12%,var(--h1) 0%,var(--h2) 62%,#05070f 100%)}
.hero-bg::after{content:'';position:absolute;inset:0;opacity:.13;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.5) 0 2px,transparent 2px 14px)}
/* ★ v9.57：首页立绘是静态的，但 filter 会让它每次重绘都重新过滤一遍。
   用底部的静态渐隐代替投影。 */
.hero-art{position:absolute;right:-4%;bottom:0;height:86%;display:flex;align-items:flex-end;opacity:.95;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 72%,transparent 100%)}
.hero-art img{height:100%;width:auto;max-width:280px;object-fit:contain}
.hero-txt{position:absolute;left:16px;bottom:80px;z-index:3;max-width:63%}
.hero-txt h2{font-size:30px;font-weight:900;margin:0;line-height:1.05;letter-spacing:.01em;
  text-shadow:0 3px 16px rgba(0,0,0,.9);
  background:linear-gradient(180deg,#fff 34%,var(--acc2));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.hero-txt .sub{font-size:10px;font-weight:800;color:var(--acc2);letter-spacing:.26em;margin-top:5px;opacity:.9}
.hero-txt .pity{margin-top:11px;display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.16);border-radius:999px;
  padding:6px 12px;font-size:11.5px;font-weight:700;color:#cfdcff}
.hero-txt .pity i{color:var(--acc);font-style:normal}
.hero-txt .pity b{color:var(--gold);font-size:14px;margin:0 2px}
/* ★ v9.57：原来是「无限浮动 + filter:drop-shadow」——
   阴影会跟着每一帧重新计算，首页一直挂着这个动画，纯浪费。
   改成：阴影用静态伪元素画一次，动画只动 transform。 */
.hero-card{position:absolute;right:12px;top:16px;width:96px;z-index:4;
  animation:floaty 3.6s ease-in-out infinite;will-change:transform}
.hero-card::before{content:'';position:absolute;left:8%;right:8%;bottom:-10px;height:22px;
  border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 72%);
  pointer-events:none;z-index:-1}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}

/* ---------- 卡池选择 ---------- */
.pooltabs{display:flex;gap:8px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.pooltabs::-webkit-scrollbar{display:none}
.pooltab{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;

/* ---------- 图鉴 / 我的 ---------- */

/* ---------- 弹层 ---------- */
/* =============================================================
   ★ 重建①：旋转模式下把所有 fixed 层改成 absolute（只换实现，外观不变）
   -------------------------------------------------------------
   本工程的横屏是靠把 `body` 设成 position:fixed + transform:rotate() 实现的。
   在**带 transform 的祖先**里，`position:fixed` 其实**本来就退化成
   absolute 的行为**（transform 会创建新的包含块）——
   也就是说这两种写法在本工程里**视觉效果完全一样**。

   但 iOS Safari 对"fixed 关键字 + transform 容器"这个组合的**合成处理不稳定**：
   浮层会在动画期间"漏"出下面的内容（玩家看到的"闪屏"），
   在桌面 Chrome 上却完全正常 —— 这就是我在本地复现不出来的原因。

   所以这里把旋转模式下的 fixed 全部显式改成 absolute：
   行为等价、外观不变，但走的是浏览器处理得最稳的那条路径。
   非旋转模式（桌面/原生横屏）**保持 fixed 不动** —— 那种情况 body 没有
   transform，fixed 本来就是对的。
   ============================================================= */
/* 完整清单：外部 CSS 里全部 19 个 position:fixed 选择器（上一版只覆盖了 10 个，
   而且外部 CSS 里的一个都没覆盖到 —— 这就是"图层有问题"的遗留部分）。
   注意 #scr-battle.active / #scr-team.active 连主屏本身都是 fixed 的。 */
html.rot .layer,
html.rot #scr-battle.active,
html.rot #scr-team.active,
html.rot #rosterLayer,
html.rot #pickLayer,
html.rot #subLayer,
html.rot #tmDragLayer,
html.rot #mineLayer,
html.rot #tutLayer,
html.rot #cmpLayer,
html.rot #oppLayer,
html.rot #cfmLayer,
html.rot #tmPoolLayer,
html.rot #cardViewer,
html.rot #finaleLayer,
html.rot #brkLayer,
html.rot #fxLayer,
html.rot #fxCanvas,
html.rot #rarBanner,
html.rot #errbar,
html.rot #toast,
html.rot #tabbar,
html.rot .shock,
html.rot .bt-slam,
html.rot .bt-streak,
html.rot .tm-ghost,
html.rot .tm-dragghost,
html.rot .spf-mask,
html.rot .ex-mask{position:absolute!important}
/* 全屏浮层打开时，把主界面彻底收掉 —— 下面没东西，就不可能有东西"漏"出来。
   浮层本身是不透明的，所以玩家看到的一模一样。 */
body.full-layer .screen{display:none!important}
body.full-layer #tabbar{display:none!important}
.layer{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  background:radial-gradient(800px 620px at 50% 38%,#1a2340 0%,#04060c 72%)}
#pullLayer{}
@keyframes fade{from{opacity:0}to{opacity:1}}
#pullLayer .head{padding:calc(14px + var(--safe-t)) 16px 4px;text-align:center}
#pullLayer .head .t{font-size:15px;font-weight:900;letter-spacing:.05em}
#pullLayer .head .s{font-size:11.5px;color:var(--muted);margin-top:4px}
/* 抽卡结果：用 flex 居中，抽 1 张也居中，十连自动换行也居中。
   之前用 grid + auto-fill，抽 1 张时只占第一列，会偏在左边。 */
/* ★★★ v9.57 抽卡流畅化：光栅化隔离
   -------------------------------------------------------------
   实测拆解（JS 侧）：
     拼 10 张卡的 HTML      0.4ms
     innerHTML + 样式解析   0.6ms
     加动画类               0.2ms
   —— JS 全都 <1ms，**卡顿 100% 在光栅化**。

   单张卡的复杂度：37 个子元素 / 12 层渐变 / 17 个阴影 / 16 个绝对定位。
   10 张同时出现 = 370 个元素要画，其中大量多层渐变叠加。
   手机 GPU 填充率低，这就是"抽卡卡一下"的根源。

   四条对策（都是"减少需要重画的东西"，不改变观感）：
     ① 整块抽卡区提升为独立合成层 —— 动画时不必重画整个页面背景
     ② 每张卡各自成为合成层 + contain —— 一张卡变化不牵连其它卡
     ③ 卡牌自身的动画只用 transform/opacity（已是），确保走纯合成
     ④ 抽卡浮层整体 contain:layout paint —— 把重绘范围锁在浮层内
   ============================================================= */
#pullGrid{
  flex:1;overflow-y:auto;padding:14px 16px;
  display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:10px;width:100%;max-width:660px;margin:0 auto;
  /* ① 独立合成层 */
  contain:layout paint style;
  transform:translateZ(0);
  backface-visibility:hidden;
}
#pullGrid .card{
  flex:0 0 auto;width:min(122px, calc((100% - 40px) / 5));
  /* ② 每张卡独立层 + 样式/绘制隔离 */
  contain:layout paint style;
  transform:translateZ(0);
  backface-visibility:hidden;
}
/* ④ 抽卡浮层把重绘范围锁在自己内部 */
#pullLayer{contain:layout paint}
#finaleLayer{contain:layout paint}
#fxLayer{contain:layout paint}
/* 单抽：卡面放大并居中 */
#pullGrid.single{max-width:100%}
#pullGrid.single .card{width:min(200px, 42vw)}
#pullLayer .foot-bar{padding:12px 16px calc(14px + var(--safe-b));display:flex;gap:10px;
  border-top:1px solid var(--line);background:rgba(4,6,12,.92)}
.btn{flex:1;border-radius:13px;padding:12px 8px;font-size:15px;font-weight:900;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
  border:1px solid var(--line);transition:transform .1s}
.btn small{display:block;font-size:10.5px;font-weight:600;color:#c9d4ee;margin-top:2px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffd977,#e8a01e);color:#2b1a00;border-color:#ffe9a8}
.btn.primary small{color:#5a3d00}
.btn[disabled]{filter:grayscale(.7) brightness(.7);pointer-events:none}

#pullGrid .card{opacity:0;transform:translateY(14px) scale(.9)}
#pullGrid .card.revealed{opacity:1;transform:none;
  transition:opacity .3s, transform .5s cubic-bezier(.2,1.5,.4,1)}
#pullGrid .card.pop{animation:popIn .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{0%{transform:scale(.86)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
.newtag{position:absolute;z-index:7;right:0;top:0;border-radius:0 0 0 3cqi;
  background:linear-gradient(135deg,#ff6b85,#c8113b);color:#fff;
  font-size:6.4cqi;font-weight:900;padding:1.5cqi 3.2cqi}

/* ---------- 开球演出 ---------- */
#fxLayer{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(620px 620px at 50% 42%,#161f38,#03050b 76%)}
#fxLayer .ballwrap{position:relative;width:180px;height:180px;display:flex;align-items:center;
  justify-content:center;animation:ballIn .55s cubic-bezier(.2,1.5,.4,1) both;
  will-change:transform,opacity;transform:translateZ(0)}
@keyframes ballIn{from{transform:scale(.2) translateY(-120px);opacity:0}to{transform:none;opacity:1}}
/* ★ v9.57 抽卡流畅化：
   原来用 filter:drop-shadow(0 12px 26px) —— filter 是**逐帧重新计算**的，
   手机 GPU 上很贵；而且带 filter 的元素无法走纯合成路径，旋转时会掉帧。
   实测玩家反馈「球跳出来卡」就是这里。
   改法：阴影用静态的 ::after 光斑代替（不进动画），
        球本体只做 transform:rotate（纯合成属性，GPU 直接转）。 */
#fxLayer .ball{font-size:88px;line-height:1;
  animation:spinBall 1.1s linear infinite;
  will-change:transform;transform:translateZ(0);backface-visibility:hidden}
/* 静态投影（不参与动画，只画一次） */
#fxLayer .ballwrap::after{content:'';position:absolute;left:50%;top:76%;
  width:74px;height:16px;margin-left:-37px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);pointer-events:none}
@keyframes spinBall{to{transform:rotate(360deg)}}
/* ★ v9.57：光晕原来用 infinite 无限脉冲 —— 会一直重绘 220px 的径向渐变。
   改成播放固定次数（起手 3 次就够营造"蓄力"感），停止后不再消耗 GPU。 */
#fxLayer .halo{position:absolute;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,var(--gc) 0%,transparent 66%);opacity:.28;
  animation:haloPulse .7s ease-in-out 3 alternate;
  will-change:transform,opacity}
@keyframes haloPulse{from{transform:scale(.86);opacity:.2}to{transform:scale(1.18);opacity:.55}}
#fxLayer .beam{position:absolute;width:3px;height:70vh;opacity:0;transform:scaleY(.3);
  background:linear-gradient(180deg,transparent,var(--gc),transparent)}
/* ★ v9.57：光柱也从 infinite 改成有限次数（渐变重绘很贵） */
#fxLayer .ballwrap.lv3 .beam,#fxLayer .ballwrap.lv4 .beam{
  opacity:.85;animation:beamUp 1.2s ease-out 2;will-change:transform,opacity}
@keyframes beamUp{0%{transform:scaleY(.2);opacity:0}40%{opacity:.9}100%{transform:scaleY(1.4);opacity:0}}
#fxLayer .ballwrap.lv4 .ball{animation:spinBall .55s linear infinite}
#fxLayer .ballwrap.burst{animation:burstOut .45s ease-out forwards}
/* ★ v9.57：去掉 filter:brightness —— 它让整个元素逐帧重新过滤。
   改用「放大 + 淡出 + 白闪层」达到同样的"炸开"观感。 */
@keyframes burstOut{to{transform:scale(2.4);opacity:0}}
#fxLayer .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fxLayer .flash.go{animation:flashOut .55s ease-out}
@keyframes flashOut{0%{opacity:0}26%{opacity:.95}100%{opacity:0}}

/* ★ v9.57 冲击波：原来用 border:3px + scale(22) ——
   边框会被一起放大约 66px 宽，每一帧都要光栅化一个巨大的圆环，手机上必卡。
   改成"背景画环"（径向渐变）+ 更大的初始尺寸，
   这样缩放时只是拉伸一张已光栅化的贴图，走 GPU 合成。 */
.shock{position:fixed;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;z-index:160;
  pointer-events:none;animation:shockOut .8s ease-out forwards;
  background:radial-gradient(circle,
    transparent 0 52%, var(--sc) 54% 62%, transparent 64% 100%);
  will-change:transform,opacity;transform:translateZ(0)}
@keyframes shockOut{0%{transform:scale(.5);opacity:.95}100%{transform:scale(7);opacity:0}}

#fxCanvas{position:fixed;inset:0;z-index:155;pointer-events:none}

/* ---------- 稀有度横幅 ---------- */
#rarBanner{position:fixed;left:0;right:0;top:30%;z-index:165;pointer-events:none;text-align:center;
  opacity:0;transform:scale(.6)}
#rarBanner.show{animation:bannerIn 1.5s cubic-bezier(.15,1.4,.4,1) both;
  will-change:transform,opacity;transform:translateZ(0)}
/* ★ v9.57：原来 filter:drop-shadow 挂在文字上 —— 文字阴影是逐字形计算的，
   52px 大字 + 24px 模糊半径，手机每帧都要重算。
   改成用 text-shadow（只算一次，进动画后不再重算）。 */
#rarBanner .b1{font-size:52px;font-weight:900;letter-spacing:.05em;line-height:1;
  color:#fff;
  text-shadow:0 0 18px var(--bc), 0 0 40px var(--bc);
  will-change:transform,opacity}
#rarBanner .b2{font-size:14px;font-weight:900;color:#fff;letter-spacing:.5em;margin-top:8px;
  text-shadow:0 0 18px var(--bc)}
@keyframes bannerIn{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.07)}
  26%{transform:scale(1)}74%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

/* ---------- 压轴展示 ---------- */
#finaleLayer{position:fixed;inset:0;z-index:170;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;background:rgba(3,5,12,.9);
  backdrop-filter:blur(6px)}
#finaleLayer .fin-rays{position:absolute;width:190vmax;height:190vmax;
  background:conic-gradient(from 0deg,transparent 0 9deg,var(--gc) 9deg 11deg,transparent 11deg 26deg);
  opacity:.2;animation:spinSlow 26s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
#finaleLayer .fin-glow{position:absolute;width:80vmin;height:80vmin;border-radius:50%;
  background:radial-gradient(circle,var(--gc) 0%,transparent 62%);opacity:.3;
  animation:haloPulse 1.1s ease-in-out infinite alternate}
#finaleLayer .fin-card{position:relative;width:206px;z-index:2;
  animation:finaleIn .75s cubic-bezier(.2,1.5,.35,1) both;
  filter:drop-shadow(0 22px 50px rgba(0,0,0,.75))}
@keyframes finaleIn{0%{transform:scale(.35) rotate(-14deg);opacity:0}
  60%{transform:scale(1.1) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
#finaleLayer .fin-name{position:relative;z-index:2;text-align:center;
  animation:fadeUp .5s .45s ease both}
#finaleLayer .fin-name b{display:block;font-size:26px;font-weight:900;letter-spacing:.1em;
  color:#fff;text-shadow:0 0 22px var(--gc)}
#finaleLayer .fin-name span{display:block;font-size:15px;font-weight:800;color:var(--gold);margin-top:6px}

/* =============================================================
   球员详情页（按参考图的版式重做）
   结构：深藏青卡头 → 红蓝页签 → 浅色内容区
   注意：内容区是浅色底 + 深色字，这是参考图最明显的特征
   ============================================================= */
#detailLayer{display:block;background:#0b1220;padding:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dwrap{width:100%;max-width:560px;margin:0 auto;padding-bottom:calc(20px + var(--safe-b))}

/* ---------- ① 卡头 ---------- */
.dhead{position:relative;padding:calc(14px + var(--safe-t)) 12px 12px;
  background:linear-gradient(160deg,#20355c 0%,#16233f 55%,#0e1830 100%);
  display:flex;gap:12px;align-items:flex-start}
.dhead::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.07;
  background:repeating-linear-gradient(115deg,#fff 0 2px,transparent 2px 16px)}
.dhead-card{position:relative;flex:0 0 96px;width:96px;z-index:2}
.dhead-card .card{box-shadow:0 8px 22px rgba(0,0,0,.6)}
.dhead-card .lvtag{position:absolute;left:0;bottom:26%;z-index:8;
  font-size:9px;font-weight:900;color:#fff;background:rgba(0,0,0,.82);
  padding:2px 6px;border-radius:3px;letter-spacing:.02em}
.dhead-card .maxbadge{position:absolute;right:-6px;top:-7px;z-index:9;
  font-size:10px;font-weight:900;color:#3a2400;letter-spacing:.06em;
  padding:2px 7px;border-radius:4px;transform:rotate(-8deg);
  background:linear-gradient(180deg,#ffe9a3,#e8a01e);
  box-shadow:0 2px 8px rgba(0,0,0,.6)}
.dhead-card .brkbadge{position:absolute;left:-5px;top:-6px;z-index:9;
  font-size:10px;font-weight:900;color:#fff;letter-spacing:.04em;
  padding:2px 7px;border-radius:4px;transform:rotate(-8deg);
  background:linear-gradient(180deg,#7d5cff,#4a1d9e);
  box-shadow:0 2px 8px rgba(0,0,0,.6)}
.dhead-info{flex:1;min-width:0;position:relative;z-index:2}
.dhead-name{font-size:24px;font-weight:900;color:#fff;line-height:1.1;
  text-shadow:0 2px 10px rgba(0,0,0,.7)}
.dhead-tags{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
.dhead-pos{font-size:12px;font-weight:900;color:#0b1220;background:#ffd977;
  padding:2px 9px;border-radius:4px}
.dhead-tier{font-size:11px;font-weight:800;color:#fff;padding:2px 9px;border-radius:4px;
  border:1px solid currentColor}
.dhead-en{font-size:10px;color:#7f8fb0;letter-spacing:.04em;margin-top:3px}
/* 6 项信息：2 列，每格"标签在左、数值在右" */
.dhead-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;
  margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.13)}
.dhead-grid .cell{display:flex;align-items:baseline;justify-content:space-between;
  gap:6px;min-width:0}

.radar-box{flex:0 0 47%;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(20,35,70,.12);

/* --- 能力：4 列 × 2 行 --- */
.ab-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ab-col{background:#fff;border-radius:5px;overflow:hidden;box-shadow:0 1px 3px rgba(20,35,70,.12);

.ab-head .val{font-size:14px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.ab-rows{padding:4px 0 5px;flex:1}
.ab-row{display:flex;align-items:baseline;justify-content:space-between;gap:3px;padding:2.5px 6px}

/* 三档配色：110+ 紫 / 80+ 绿 / 不到 80 灰 */

.ab-row.lv-p{background:#f5edff}

/* --- 徽章：左侧计数栏 + 徽章卡 --- */
.bd-wrap{display:flex;gap:8px;align-items:flex-start}
.bd-side{flex:0 0 62px;display:flex;flex-direction:column;gap:5px}
.bd-cnt{display:flex;align-items:center;gap:6px;background:#fff;border-radius:5px;
  padding:6px 7px;box-shadow:0 1px 3px rgba(20,35,70,.12)}
.bd-cnt i{font-style:normal;flex:0 0 20px;width:20px;height:20px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff}
.bd-cnt.on i{background:linear-gradient(180deg,#5ee08a,#1f9d4d)}
.bd-cnt span{font-size:11px;font-weight:800;color:#4a5876}
.bd-list{flex:1;min-width:0;display:grid;grid-template-columns:1fr;gap:6px}
.bd-card{display:flex;align-items:center;gap:8px;background:#fff;border-radius:5px;
  padding:7px 9px;box-shadow:0 1px 3px rgba(20,35,70,.12);border-left:3px solid var(--bc)}
.bd-ico{flex:0 0 30px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:15px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,var(--bc),var(--bc2));color:#fff}
.bd-txt{flex:1;min-width:0}
.bd-nm{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:900;color:#16233f}
.bd-nm em{font-style:normal;font-size:9.5px;font-weight:900;color:#fff;padding:0 5px;
  border-radius:3px;background:var(--bc)}
.bd-ds{font-size:10.5px;color:#6b7893;margin-top:2px;line-height:1.35}
.bd-v{font-size:14px;font-weight:900;color:var(--bc);font-variant-numeric:tabular-nums}
.bd-locked{display:flex;align-items:center;gap:8px;background:#f4f6fa;border-radius:5px;
  padding:7px 9px;border-left:3px solid #cdd6e4;opacity:.85}
.bd-locked .bd-nm{color:#8b96ad}
.bd-locked .bd-ds{color:#a3adc2}
.bd-ico.lock{background:#dfe5ef;color:#8b96ad;font-size:13px}
.bd-more{background:#f4f6fa;border-radius:5px;padding:10px;text-align:center;
  font-size:11.5px;color:#8b96ad;font-weight:700;border:1px dashed #cdd6e4}
.bd-next{background:#fff;border-radius:5px;padding:8px 7px;text-align:center;
  box-shadow:0 1px 3px rgba(20,35,70,.12)}
.bd-next b{display:block;font-size:17px;font-weight:900;color:#16233f;line-height:1.1;
  font-variant-numeric:tabular-nums}
.bd-next b i{font-style:normal;font-size:11px;color:#93a0b8}
.bd-next span{font-size:10px;color:#7b88a3;font-weight:700}
.bt-cap{font-style:normal;font-size:11px;font-weight:800;color:#93a0b8;margin-left:2px}
.bd-empty{background:#fff;border-radius:5px;padding:30px 16px;text-align:center;
  font-size:12.5px;color:#7b88a3;line-height:1.9;box-shadow:0 1px 3px rgba(20,35,70,.12)}

/* --- 底部操作区 --- */
.dfoot{background:#eef1f6;padding:0 10px 4px}
.dmoment{background:#fff8e4;border-left:3px solid #e8a01e;border-radius:5px;
  padding:9px 11px;font-size:12px;font-weight:700;color:#8a5c00;margin-bottom:9px;
  box-shadow:0 1px 3px rgba(20,35,70,.1)}
.dupsell{background:#fff;border-radius:5px;padding:11px;text-align:center;

.dbtns{display:flex;gap:8px}
.dbtns .btn{flex:1;border-radius:6px;padding:12px 8px;font-size:15px;font-weight:900;
  background:#fff;color:#16233f;border:1px solid #cfd8e6;box-shadow:0 1px 3px rgba(20,35,70,.1)}
.dbtns .btn small{display:block;font-size:10.5px;font-weight:600;color:#6b7893;margin-top:2px}
.dbtns .btn.primary{background:linear-gradient(180deg,#ff5a72,#c8113b);color:#fff;

.dbtns .btn[disabled]{filter:grayscale(.75) brightness(.96);opacity:.6;pointer-events:none}
.dcredit{text-align:center;font-size:10px;color:#8b96ad;padding:9px 0 4px}


/* ---------- 突破刻度 ---------- */
.pips{display:inline-flex;gap:2.5px;align-items:center}
.pips i{width:7px;height:7px;border-radius:2px;background:rgba(255,255,255,.16);
  transform:rotate(45deg);transition:.2s}
.pips i.on{background:linear-gradient(180deg,#ffe9a3,#e8a01e);
  box-shadow:0 0 6px rgba(245,196,81,.85)}
.brk{display:flex;justify-content:center;margin-top:1.6cqi}
.card .brk .pips i{width:1.9cqi;height:1.9cqi}
.card .brk .pips i.on{box-shadow:0 0 1.4cqi rgba(245,196,81,.9)}
.brk-tag{position:absolute;z-index:5;left:0;top:22%;font-size:6cqi;font-weight:900;
  padding:1.2cqi 2.6cqi 1.2cqi 2cqi;border-radius:0 999px 999px 0;
  background:linear-gradient(90deg,#ffe9a3,#e8a01e);color:#3a2400;
  box-shadow:0 1cqi 3cqi rgba(0,0,0,.45)}
.card.moment .brk-tag{top:32%}
.brk-name{font-size:14px;font-weight:900;color:var(--gold)}
.brk-num{font-size:11.5px;color:var(--muted);font-weight:800}
.brk-bar{margin-top:7px}
.brk-bar .pips{gap:5px}
.brk-bar .pips i{width:11px;height:11px}

/* =============================================================
   突破演出
   流程：能量汇聚 → 冲击爆闪 → 刻度逐个点亮 + 综合分滚动 → 横幅定格
   ============================================================= */
#brkLayer{position:fixed;inset:0;z-index:180;display:flex;align-items:center;justify-content:center;
  flex-direction:column;overflow:hidden;
  background:radial-gradient(720px 720px at 50% 46%,#151d35 0%,#03050b 78%)}
#brkLayer .brk-rays{position:absolute;width:185vmax;height:185vmax;opacity:0;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 8deg,var(--gc) 8deg 10.5deg,transparent 10.5deg 24deg);
  animation:spinSlow 30s linear infinite;transition:opacity .45s}
#brkLayer.charging .brk-rays{opacity:.14}
#brkLayer.burst .brk-rays{opacity:.55}
#brkLayer .brk-glow{position:absolute;width:72vmin;height:72vmin;border-radius:50%;opacity:0;
  pointer-events:none;background:radial-gradient(circle,var(--gc) 0%,transparent 62%);
  transition:opacity .4s, transform .5s}
#brkLayer.charging .brk-glow{opacity:.22;animation:haloPulse .85s ease-in-out infinite alternate}
#brkLayer.burst .brk-glow{opacity:.72;transform:scale(1.7)}

.brk-stage{position:relative;z-index:4;width:212px;display:flex;flex-direction:column;
  align-items:center;gap:14px;margin-top:8vh}
#brkLayer.charging .brk-card{animation:brkFloat 1.15s ease-in-out infinite}
@keyframes brkFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-11px) scale(1.045)}}
#brkLayer.burst .brk-card{animation:brkHit .42s cubic-bezier(.2,1.4,.4,1)}
/* ★ v9.57：去掉 filter:brightness（逐帧重新过滤整张卡）。
   改用「放大 + 叠一层白色闪光元素」达到同样的爆闪观感。 */
@keyframes brkHit{0%{transform:scale(1)}32%{transform:scale(1.17) rotate(-2.5deg)}
  100%{transform:scale(1.05)}}
#brkLayer.burst .brk-card::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:#fff;animation:brkFlash .42s ease-out forwards;pointer-events:none}
@keyframes brkFlash{0%{opacity:0}30%{opacity:.85}100%{opacity:0}}
#brkLayer.done .brk-card{transform:scale(1.05)}
/* ★ v9.57：突破卡本体也用静态投影代替 filter */
.brk-card{width:208px;flex:0 0 auto;position:relative}
.brk-card::before{content:'';position:absolute;left:6%;right:6%;bottom:-14px;height:30px;
  border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 72%);
  pointer-events:none;z-index:-1}
.brk-card .card{width:100%}

/* 冲击波环 */
.brk-rings{position:absolute;left:50%;top:44%;width:0;height:0;pointer-events:none;z-index:2}
.brk-rings i{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;
  border-radius:50%;border:3px solid var(--gc);opacity:0}
#brkLayer.burst .brk-rings i{animation:brkRing .9s cubic-bezier(.2,.8,.3,1) forwards}
#brkLayer.burst .brk-rings i:nth-child(2){animation-delay:.1s;border-width:2px}
#brkLayer.burst .brk-rings i:nth-child(3){animation-delay:.2s;border-width:1.5px}
@keyframes brkRing{0%{transform:scale(.4);opacity:.95}100%{transform:scale(26);opacity:0}}

/* 汇聚粒子 */
.brk-spark{position:absolute;left:50%;top:44%;width:6px;height:6px;border-radius:50%;
  background:var(--gc);box-shadow:0 0 10px var(--gc);opacity:0;pointer-events:none;z-index:3}
#brkLayer.charging .brk-spark{animation:sparkIn .95s cubic-bezier(.5,0,.7,1) forwards}
@keyframes sparkIn{
  0%{transform:translate(var(--sx),var(--sy)) scale(.5);opacity:0}
  18%{opacity:1}
  100%{transform:translate(0,0) scale(1.5);opacity:0}
}
/* 上升的金色粒子 */
.brk-rise{position:absolute;bottom:-20px;width:4px;height:4px;border-radius:50%;
  background:#ffe08a;box-shadow:0 0 8px #ffd23f;opacity:0;pointer-events:none;z-index:3}
#brkLayer.done .brk-rise{animation:riseUp 1.6s ease-out forwards}
@keyframes riseUp{0%{transform:translateY(0) scale(.6);opacity:0}
  20%{opacity:1}100%{transform:translateY(-88vh) scale(1.1);opacity:0}}

/* 综合分滚动 */
.brk-ovr{position:relative;height:44px;width:100%;display:flex;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums}
.brk-ovr span,.brk-ovr b{position:absolute;font-size:38px;font-weight:900;line-height:1;
  transition:opacity .3s, transform .35s}
.brk-ovr span{color:#5f6a86}
.brk-ovr b{color:#fff;opacity:0;transform:scale(.6);
  text-shadow:0 0 22px var(--gc), 0 3px 12px rgba(0,0,0,.8)}
#brkLayer.done .brk-ovr span{opacity:0;transform:translateY(-16px)}
#brkLayer.done .brk-ovr b{opacity:1;transform:scale(1)}

/* 突破刻度逐个点亮 */
.brk-pips{display:flex;gap:7px;justify-content:center}
.brk-pips i{width:13px;height:13px;border-radius:3px;transform:rotate(45deg);
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);transition:.25s}
.brk-pips i.on{background:linear-gradient(180deg,#fff2c0,#e8a01e);border-color:#ffe9a3;
  box-shadow:0 0 12px rgba(245,196,81,.95)}
.brk-pips i.fresh{animation:pipPop .42s cubic-bezier(.2,1.8,.4,1)}
@keyframes pipPop{0%{transform:rotate(45deg) scale(1)}45%{transform:rotate(45deg) scale(1.9)}100%{transform:rotate(45deg) scale(1)}}

/* 横幅 */
.brk-banner{position:absolute;left:0;right:0;top:16%;z-index:6;text-align:center;pointer-events:none}
/* ★ v9.57：文字上的 filter:drop-shadow 是逐字形算的，44px 大字很贵。
   改成 text-shadow（只算一次）。 */
.brk-banner b{display:block;font-size:44px;font-weight:900;letter-spacing:.14em;line-height:1;
  color:#fff;text-shadow:0 0 16px var(--gc), 0 0 36px var(--gc);
  will-change:transform,opacity;
  opacity:0;transform:scale(2.4)}
.brk-banner span{display:block;margin-top:10px;font-size:17px;font-weight:900;color:#fff;
  letter-spacing:.32em;text-shadow:0 0 16px var(--gc);opacity:0;transform:translateY(10px)}
#brkLayer.done .brk-banner b{animation:bannerSlam .55s cubic-bezier(.15,1.5,.35,1) forwards}
#brkLayer.done .brk-banner span{animation:fadeUp .45s .3s ease forwards}
@keyframes bannerSlam{0%{opacity:0;transform:scale(2.4)}
  55%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}

#brkLayer.fade{opacity:0;transition:opacity .45s}

/* ---------- toast / 错误条 ---------- */
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(14px);z-index:220;
  padding:10px 20px;border-radius:999px;font-size:13px;font-weight:800;
  background:rgba(10,14,26,.97);border:1px solid var(--line);color:var(--ink);

#errbar{position:fixed;left:0;right:0;bottom:0;z-index:300;background:#7a1020;color:#ffd9de;
  font:12px/1.5 monospace;padding:8px 12px;white-space:pre-wrap}
/* ---------- 搜索框 ---------- */

<script>
  window.addEventListener('error', function (e) {
    var b = document.getElementById('errbar');
    if (!b) { b = document.createElement('div'); b.id = 'errbar'; document.body.appendChild(b); }
    var detail = (e.message || '') +
      ' @' + (e.filename || '?').split('/').pop() + ':' + (e.lineno || '?') + ':' + (e.colno || '?') +
      ' | ' + (e.error && e.error.stack ? String(e.error.stack).split('\n').slice(0, 3).join(' >> ') : 'no-stack');
    b.textContent = '运行出错：' + detail;
    document.title = 'ERR: ' + detail;
  });
</script>
